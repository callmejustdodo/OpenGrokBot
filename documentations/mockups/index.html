<!doctype html>
<html lang="ko" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenGrokBot — Mockup M3</title>
<style>
/* ---------- Product tokens (3_screen_list_and_user_flows.md Rev 2, design system) ---------- */
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --desk: linear-gradient(140deg, #e7ebf1 0%, #f1f1f4 55%, #ebe7f0 100%);
  --win: #fcfcfc; --side: #f5f5f5; --sel: #e9e9eb; --hover: rgba(0,0,0,.04);
  --bub: #f0f0f0; --me: #1a1a1a; --me-fg: #ffffff; --primary: #1a1a1a; --primary-fg: #ffffff;
  --sec: #efefef; --card: #ffffff; --field: #ffffff;
  --text: #1a1a1a; --text2: rgba(0,0,0,.6); --text3: rgba(0,0,0,.35); --sep: rgba(0,0,0,.08);
  --focus: #007aff;
  --green: #28cd41; --orange: #ff9500; --yellow: #e0b000; --red: #ff3b30; --gray: #8e8e93;
  --scrim: rgba(0,0,0,.16); --shadow: 0 24px 70px rgba(0,0,0,.18), 0 0 0 .5px rgba(0,0,0,.14);
  --soft: 0 2px 10px rgba(0,0,0,.06), 0 0 0 .5px rgba(0,0,0,.06);
  --menubar: rgba(246,246,250,.72); --term: #1e1f22;
}
:root[data-theme="dark"] {
  --desk: linear-gradient(140deg, #16191f 0%, #1c1c21 55%, #221d26 100%);
  --win: #161618; --side: #1c1c1e; --sel: #2c2c2e; --hover: rgba(255,255,255,.05);
  --bub: #2a2a2c; --me: #f2f2f2; --me-fg: #111111; --primary: #f2f2f2; --primary-fg: #111111;
  --sec: #2c2c2e; --card: #1f1f22; --field: #232326;
  --text: #f5f5f7; --text2: rgba(235,235,245,.62); --text3: rgba(235,235,245,.34); --sep: rgba(255,255,255,.1);
  --focus: #0a84ff;
  --green: #32d74b; --orange: #ff9f0a; --yellow: #ffd60a; --red: #ff453a; --gray: #98989d;
  --scrim: rgba(0,0,0,.45); --shadow: 0 24px 70px rgba(0,0,0,.6), 0 0 0 .5px rgba(255,255,255,.14);
  --soft: 0 2px 10px rgba(0,0,0,.3), 0 0 0 .5px rgba(255,255,255,.08);
  --menubar: rgba(30,30,34,.7);
}
@media (prefers-color-scheme: dark) {
  :root[data-theme="system"] {
    --desk: linear-gradient(140deg, #16191f 0%, #1c1c21 55%, #221d26 100%);
    --win: #161618; --side: #1c1c1e; --sel: #2c2c2e; --hover: rgba(255,255,255,.05);
    --bub: #2a2a2c; --me: #f2f2f2; --me-fg: #111111; --primary: #f2f2f2; --primary-fg: #111111;
    --sec: #2c2c2e; --card: #1f1f22; --field: #232326;
    --text: #f5f5f7; --text2: rgba(235,235,245,.62); --text3: rgba(235,235,245,.34); --sep: rgba(255,255,255,.1);
    --focus: #0a84ff;
    --green: #32d74b; --orange: #ff9f0a; --yellow: #ffd60a; --red: #ff453a; --gray: #98989d;
    --scrim: rgba(0,0,0,.45); --shadow: 0 24px 70px rgba(0,0,0,.6), 0 0 0 .5px rgba(255,255,255,.14);
    --soft: 0 2px 10px rgba(0,0,0,.3), 0 0 0 .5px rgba(255,255,255,.08);
    --menubar: rgba(30,30,34,.7);
  }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font); font-size: 14px; color: var(--text); background: #0f1115; display: flex; flex-direction: column; overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--focus) 55%, transparent); outline-offset: 1px; border-radius: 8px; }

/* ---------- Review chrome (not product UI) ---------- */
.review { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 14px; background: #111318; color: #e5e7eb; font: 12px/1.3 -apple-system, system-ui, sans-serif; border-bottom: 1px solid #2a2d35; }
.rv-tag { margin-left: 8px; padding: 2px 6px; border-radius: 4px; background: #3b2f12; color: #fcd34d; font-size: 11px; }
.review select { background: #1f232b; border: 1px solid #343944; border-radius: 6px; padding: 4px 6px; color: #e5e7eb; max-width: 330px; }
.rv-states { display: flex; flex-wrap: wrap; gap: 4px; }
.rv-chip { border: 1px solid #343944; background: #1a1d24; color: #cbd5e1; border-radius: 999px; padding: 3px 9px; cursor: pointer; font-size: 11px; }
.rv-chip[aria-pressed="true"] { background: #e5e7eb; color: #111318; border-color: #e5e7eb; }
.rv-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.rv-seg { display: inline-flex; border: 1px solid #343944; border-radius: 6px; overflow: hidden; }
.rv-seg button { background: #1a1d24; border: 0; color: #cbd5e1; padding: 3px 9px; cursor: pointer; font-size: 11px; }
.rv-seg button[aria-pressed="true"] { background: #e5e7eb; color: #111318; }
.rv-note { flex: none; padding: 6px 14px; background: #171a20; color: #9ca3af; font: 11.5px/1.45 -apple-system, system-ui, sans-serif; border-bottom: 1px solid #2a2d35; }
.rv-note b { color: #e5e7eb; font-weight: 600; }

/* ---------- Desktop stage ---------- */
.desk { flex: 1; position: relative; overflow: hidden; background: #0f1115; }
.stage { position: absolute; left: 0; top: 0; width: 1300px; height: 840px; background: var(--desk); transform-origin: 0 0; overflow: hidden; }
.mac-bar { position: absolute; inset: 0 0 auto 0; height: 26px; display: flex; align-items: center; gap: 18px; padding: 0 14px; background: var(--menubar); backdrop-filter: blur(20px); font-size: 13px; color: var(--text); z-index: 8; }
.mac-bar .logo { width: 13px; height: 13px; }
.mac-bar b { font-weight: 700; }
.mb-item { padding: 2px 6px; border-radius: 4px; cursor: default; }
.mb-item.open { background: var(--sel); }
.mb-right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
.mb-icon { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 20px; border-radius: 4px; cursor: pointer; border: 0; background: transparent; padding: 0; color: var(--text); }
.mb-icon.open { background: var(--sel); }
.mb-icon .d { position: absolute; right: 2px; top: 2px; width: 6px; height: 6px; border-radius: 50%; background: var(--orange); }
.mb-menu { position: absolute; top: 26px; left: 86px; width: 270px; background: var(--card); border-radius: 10px; box-shadow: var(--shadow); padding: 5px; z-index: 9; }
.mb-menu button { display: flex; width: 100%; justify-content: space-between; border: 0; background: transparent; padding: 5px 10px; border-radius: 6px; cursor: pointer; }
.mb-menu button:hover { background: var(--sel); }
.mb-menu kbd { font-family: var(--font); opacity: .55; }
.mb-menu hr { border: 0; border-top: 1px solid var(--sep); margin: 4px 6px; }

/* ---------- Window ---------- */
.window { position: absolute; background: var(--win); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
.main-win { left: 60px; top: 56px; width: 1180px; height: 740px; display: grid; grid-template-columns: 280px minmax(0, 1fr) auto; }
.traffic { display: flex; gap: 8px; }
.tl { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.tl.r { background: #ff5f57; } .tl.y { background: #febc2e; } .tl.g { background: #28c840; }
.dim { opacity: .5; filter: saturate(.85); pointer-events: none; }

/* sidebar */
.side { background: var(--side); display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--sep); }
.side-top { display: flex; align-items: center; gap: 2px; padding: 16px 12px 10px 18px; }
.side-top .traffic { margin-right: auto; }
.ticon { position: relative; width: 32px; height: 32px; border-radius: 10px; border: 0; background: transparent; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text2); flex: none; }
.ticon:hover { background: var(--hover); color: var(--text); }
.ticon[aria-current="page"] { background: var(--sel); color: var(--text); }
.ticon.plus { background: var(--card); box-shadow: var(--soft); color: var(--text); margin-left: 4px; }
.ticon .cnt { position: absolute; top: 2px; right: 1px; min-width: 15px; height: 15px; padding: 0 4px; border-radius: 999px; background: var(--orange); color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.needs { margin: 2px 12px 8px; display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 12px; background: color-mix(in srgb, var(--orange) 12%, var(--side)); border: 0; cursor: pointer; text-align: left; width: calc(100% - 24px); }
.needs b { font-weight: 600; }
.needs small { display: block; color: var(--text2); font-size: 12px; }
.needs .ic { color: var(--orange); }
.chats { flex: 1; overflow: auto; padding: 2px 10px; display: flex; flex-direction: column; gap: 2px; }
.chat { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 12px; border: 0; background: transparent; cursor: pointer; text-align: left; width: 100%; }
.chat:hover { background: var(--hover); }
.chat[aria-current="true"] { background: var(--sel); }
.chat .ct { flex: 1; min-width: 0; }
.chat .ct .top { display: flex; justify-content: space-between; gap: 8px; }
.chat .ct .nm { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat .ct .nm em { font-style: normal; font-weight: 400; color: var(--text2); }
.chat .ct .tm { font-size: 11.5px; color: var(--text3); flex: none; }
.chat .ct .pv { color: var(--text2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.chat .ct .pv.attn { color: var(--text); }
.side-bottom { display: flex; align-items: center; gap: 8px; padding: 12px 14px 14px; }
.side-bottom .prof { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.side-bottom .prof small { display: block; color: var(--text2); font-size: 11.5px; }

/* avatars */
.ava { position: relative; flex: none; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; }
.ava.sq { border-radius: 30%; background: var(--c); }
.ava.bot svg { width: 100%; height: 100%; display: block; overflow: visible; }
.ava.bot.working svg { animation: bob 2.6s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4%); } }
.shapes { display: flex; gap: 6px; flex-wrap: wrap; }
.shape-btn { width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid var(--sep); background: var(--field); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 4px; }
.shape-btn[aria-pressed="true"] { border-color: var(--text); }
.swatches { display: flex; gap: 8px; margin-top: 8px; }
.swatch { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--win); box-shadow: 0 0 0 1px var(--sep); cursor: pointer; padding: 0; }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--text); }
.ava.ci { border-radius: 50%; background: var(--c); }
.ava .ic { width: 52%; height: 52%; stroke-width: 1.6; }
.ava .dot { position: absolute; right: -2px; bottom: -2px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--side); }
.ava .own { position: absolute; right: -4px; bottom: -4px; width: 17px; height: 17px; border-radius: 50%; border: 2px solid var(--side); font-size: 9px; display: flex; align-items: center; justify-content: center; color: #fff; font-style: normal; }
.dot.st-working { background: var(--green); } .dot.st-approval { background: var(--orange); } .dot.st-stalled { background: var(--yellow); }
.dot.st-error { background: var(--red); } .dot.st-idle { background: var(--gray); } .dot.st-stopped, .dot.st-unknown { background: var(--text3); }

/* center */
.center { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
.c-head { height: 64px; flex: none; display: flex; align-items: center; justify-content: center; position: relative; padding: 0 16px; }
.pill { display: inline-flex; align-items: center; gap: 9px; padding: 6px 16px 6px 7px; border-radius: 999px; background: var(--card); box-shadow: var(--soft); font-weight: 600; font-size: 15px; max-width: calc(100% - 200px); white-space: nowrap; }
.pill .st { font-weight: 400; font-size: 12.5px; color: var(--text2); display: inline-flex; align-items: center; gap: 5px; overflow: hidden; text-overflow: ellipsis; }
.c-head .right { position: absolute; right: 14px; top: 16px; display: flex; gap: 4px; align-items: center; }
.msgs { flex: 1; overflow: auto; padding: 4px 28px 18px; display: flex; flex-direction: column; gap: 10px; }
.sep-t { align-self: center; color: var(--text2); font-size: 12.5px; margin: 6px 0; }
.ag, .me { max-width: 78%; padding: 10px 15px; border-radius: 20px; line-height: 1.55; font-size: 15px; }
.ag { align-self: flex-start; background: var(--bub); }
.me { align-self: flex-end; background: var(--me); color: var(--me-fg); }
.ag .src { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 8px; padding-top: 7px; border-top: 1px solid var(--sep); color: var(--text2); font-size: 12.5px; }
.stale { color: var(--orange); display: inline-flex; align-items: center; gap: 4px; }
details.ex { margin-top: 6px; font-size: 13px; }
details.ex summary { cursor: pointer; color: var(--text2); }
details.ex blockquote { margin: 5px 0 0; padding: 4px 10px; border-left: 3px solid var(--sep); color: var(--text2); }
.acts { display: flex; flex-wrap: wrap; gap: 2px; margin-top: -4px; }
.steps { align-self: flex-start; width: 78%; }
.steps summary { list-style: none; cursor: pointer; color: var(--text2); font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; padding: 2px 4px; border-radius: 6px; }
.steps summary::-webkit-details-marker { display: none; }
.steps summary:hover { background: var(--hover); }
.step { display: flex; align-items: center; gap: 8px; padding: 4px 6px 4px 10px; color: var(--text2); font-size: 13px; border-left: 2px solid var(--sep); margin-left: 8px; }
.step .mono { color: var(--text); }
.working { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; color: var(--text2); font-size: 13px; padding: 4px 6px; }
.dots { display: inline-flex; gap: 3px; } .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--text3); animation: blink 1.2s infinite; }
.dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
.icard { align-self: flex-start; width: 78%; background: var(--card); border-radius: 16px; box-shadow: var(--soft); padding: 12px 14px; }
.icard .h { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.icard .h > .ic { color: var(--orange); }
.icard p { margin: 4px 0 8px; color: var(--text2); font-size: 13px; }
.choice .opt { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 9px 11px; border: 1px solid var(--sep); background: var(--field); border-radius: 12px; margin-top: 6px; cursor: pointer; }
.choice .opt:hover { border-color: var(--text3); }
.choice .opt.best { border-color: var(--text); }
.choice .opt small { color: var(--text2); display: block; font-size: 12.5px; }
.tagpill { margin-left: auto; font-size: 11px; font-weight: 600; background: var(--sec); border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
.banner { margin: 0 28px 10px; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 14px; background: var(--card); box-shadow: var(--soft); }
.banner .bt { flex: 1; font-size: 13px; color: var(--text2); }
.banner .bt b { display: block; color: var(--text); font-size: 14px; font-weight: 600; }
.banner.warn > .ic { color: var(--orange); } .banner.err > .ic { color: var(--red); } .banner.stall > .ic { color: var(--yellow); } .banner.info > .ic { color: var(--text2); }
.queued { margin: 0 24px 8px; display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 14px; border-radius: 14px; background: var(--card); box-shadow: var(--soft); font-size: 13px; }
.queued .qt { flex: 1; min-width: 0; }
.queued .qt small { display: block; color: var(--text2); font-size: 12px; }
.composer { margin: 0 20px 18px; display: flex; align-items: flex-end; gap: 8px; padding: 8px; border-radius: 26px; background: var(--card); box-shadow: var(--soft); }
.composer textarea { flex: 1; border: 0; outline: none; resize: none; background: transparent; min-height: 36px; max-height: 120px; padding: 8px 4px; line-height: 1.4; font-size: 15px; }
.composer.off { opacity: .55; }
.cbtn { width: 36px; height: 36px; border-radius: 50%; border: 0; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
.cbtn.add { background: var(--sec); color: var(--text2); }
.cbtn.go { background: var(--primary); color: var(--primary-fg); }
.cbtn[disabled] { opacity: .35; cursor: not-allowed; }
.c-note { text-align: center; color: var(--text3); font-size: 11.5px; margin: -10px 0 12px; }
.stopped-bar { margin: 0 20px 18px; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 14px; border-radius: 26px; background: var(--card); box-shadow: var(--soft); color: var(--text2); }

/* center pages (Inbox, Team, ...) */
.page { flex: 1; overflow: auto; padding: 22px 30px; }
.page h1 { font-size: 20px; font-weight: 600; margin: 0; display: flex; align-items: center; gap: 10px; }
.page .h1row { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
.page .lead { color: var(--text2); font-size: 13px; }
.grp { font-size: 12px; font-weight: 600; color: var(--text2); margin: 18px 4px 8px; display: flex; align-items: center; gap: 6px; }
.list { background: var(--card); border-radius: 16px; box-shadow: var(--soft); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0; border-bottom: 1px solid var(--sep); background: transparent; width: 100%; text-align: left; }
.row:last-child { border-bottom: 0; }
button.row { cursor: pointer; } button.row:hover { background: var(--hover); }
.row .t { flex: 1; min-width: 0; }
.row .t small { display: block; color: var(--text2); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.row .when { color: var(--text3); font-size: 12px; flex: none; }
.empty { text-align: center; padding: 90px 20px; color: var(--text2); }
.empty > .ic { width: 34px; height: 34px; color: var(--text3); margin-bottom: 10px; }
.empty b { display: block; color: var(--text); font-size: 17px; margin-bottom: 6px; font-weight: 600; }
.empty .row-actions { justify-content: center; margin-top: 16px; }

/* right panel */
.panel { width: 300px; border-left: 1px solid var(--sep); overflow: auto; padding: 22px 18px; display: flex; flex-direction: column; gap: 12px; }
.p-head { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
.p-head b { font-size: 17px; font-weight: 600; display: block; }
.p-head small { color: var(--text2); font-size: 13px; }
.p-lbl { color: var(--text2); font-size: 12.5px; margin: 6px 2px -4px; }
.p-card { background: var(--card); border-radius: 14px; box-shadow: var(--soft); padding: 12px 14px; display: block; width: 100%; text-align: left; border: 0; }
button.p-card { cursor: pointer; } button.p-card:hover { box-shadow: 0 0 0 1px var(--text3); }
.p-card.focus { box-shadow: 0 0 0 1.5px var(--text); }
.p-card .pr { display: flex; align-items: center; gap: 8px; }
.p-card .pr b { font-weight: 600; flex: 1; }
.p-card small { display: block; color: var(--text2); font-size: 12.5px; margin-top: 3px; line-height: 1.45; }
.p-card .chev { color: var(--text3); }
.kv { display: grid; grid-template-columns: 82px 1fr; gap: 7px 10px; font-size: 13px; margin: 0; }
.kv dt { color: var(--text2); } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.form-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--sep); }
.form-row:last-child { border-bottom: 0; }
.form-row small { display: block; color: var(--text2); font-size: 12px; }

/* controls */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 0; background: var(--sec); border-radius: 999px; padding: 6px 14px; cursor: pointer; white-space: nowrap; font-size: 13.5px; }
.btn:hover { filter: brightness(.97); }
.btn.primary { background: var(--primary); color: var(--primary-fg); }
.btn.destructive { background: transparent; color: var(--red); }
.btn.plain { background: transparent; color: var(--text2); padding: 4px 8px; font-size: 12.5px; }
.btn.plain:hover { background: var(--hover); color: var(--text); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btn .k { opacity: .55; font-size: 11px; }
.ic { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.status { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.status .ic { width: 13px; height: 13px; }
.st-working .ic { color: var(--green); } .st-idle .ic { color: var(--gray); } .st-approval .ic { color: var(--orange); }
.st-stalled .ic { color: var(--yellow); } .st-error .ic { color: var(--red); } .st-stopped .ic, .st-unknown .ic { color: var(--text3); }

document.getElementById("rv-states").addEventListener("click", (e) => { const b = e.target.closest("[data-rv-state]"); if (b) nav(S.screen, b.dataset.rvState); });
document.getElementById("rv-theme").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { S.theme = b.dataset.v; render(); } });
document.getElementById("rv-lang").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { S.lang = b.dataset.v; render(); } });
stage.addEventListener("click", (e) => {
  const t = e.target.closest("[data-go],[data-act],[data-close]");
  if (!t || t.disabled) return;
  if (t.dataset.go) return nav(t.dataset.go, t.dataset.st);
  if (t.hasAttribute("data-close")) return closeOverlay();
  const a = t.dataset.act;
  if (a === "menu") { S.menu = !S.menu; render(); }
  else if (a === "close") closeOverlay();
  else if (a === "panel") { S.panel = !S.panel; render(); }
  else if (a === "toggle") t.setAttribute("aria-checked", t.getAttribute("aria-checked") !== "true");
  else if (a === "seg") t.parentElement.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b === t));
  else if (a === "radio") t.parentElement.querySelectorAll(".harness").forEach((b) => b.setAttribute("aria-checked", b === t));
  else if (a === "send" || a === "flow") runAsk();
  else if (a === "send-mine") { if (S.screen === "SC-005" && ["working", "approval", "permission"].includes(S.state)) nav("SC-005", "queued"); else if (S.screen === "SC-005" && S.state === "idle") nav("SC-005", "working"); else toast(L("보냈어요", "Sent")); }
  else if (a === "stop") nav("SC-005", "stop-confirm");
  else if (a === "steer") toast(L("지금 차례에 전달했어요", "Delivered into the running turn"), "SC-005", "working");
  else if (a === "withdraw") toast(L("대기 메시지를 취소했어요", "Queued message withdrawn"), "SC-005", "working");
  else if (a === "refresh" || a === "pick") { S.state = "answering"; render(); later(1200, () => { S.state = "answered"; render(); }); }
  else if (a === "approved") toast(L("허용했어요 · 민수에게 알렸어요", "Allowed · Minsu was notified"), "SC-010", "default");
  else if (a === "denied") toast(L("거절했어요 · 민수에게 알렸어요", "Denied · Minsu was notified"), "SC-010", "default");
  else if (a === "toast-allow") toast(L("허용했어요", "Allowed"), "SC-005", "working");
  else if (a === "toast-deny") toast(L("거부했어요", "Denied"), "SC-005", "working");
  else if (a === "toast-restart") toast(L("재시작했어요", "Restarted"));
  else if (a === "revoked") toast(L("규칙을 취소했어요", "Rule revoked"));
  else if (a === "deleted") toast(L("삭제했어요", "Deleted"), "SC-017", "default");
  else if (a === "toast-cancel") toast(L("질문을 취소했어요", "Question canceled"));
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if (S.menu) { S.menu = false; render(); } else closeOverlay(); }
  if (e.key === "Enter" && e.metaKey) {
    if (S.screen === "SC-015") { e.preventDefault(); runAsk(); }
    else if (S.screen === "SC-005") { e.preventDefault(); stage.querySelector('[data-act="send-mine"]')?.click(); }
  }
});
window.addEventListener("resize", fit);
window.addEventListener("hashchange", () => { parseHash(); render(); });
parseHash();
render();
</script>
</body>
</html>
