[package]
name = "formation-desktop"
description = "Formation macOS app: a thin client of formationd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name
# (https://github.com/rust-lang/cargo/issues/8519).
name = "formation_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
