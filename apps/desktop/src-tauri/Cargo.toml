[package]
name = "formation-desktop"
description = "Formation macOS app: a thin client of formationd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name
# (https://github.com/rust-lang/cargo/issues/8519).
name = "formation_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "macros"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2.8.4"

[dev-dependencies]
# tests/typescript_commands.rs generates the TypeScript method map from the contract.
formation-proto = { path = "../../../crates/formation-proto" }
ts-rs = "12.0.1"
# tests/formationd_client.rs drives the socket client against the fake.
fake-formationd = { path = "../../../tools/fake-formationd" }
