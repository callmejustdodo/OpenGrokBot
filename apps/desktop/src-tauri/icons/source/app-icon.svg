<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- OpenGrokBot app icon, from the Figma file "Formation — Mockup M3", v2 Sky Glass:
       the main agent's glossy orb (node 60:146) carrying the menu bar mark (node 29:22),
       on the Sky Glass backdrop. macOS icon grid: an 824 px rounded square in a 1024 px canvas. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8ff"/>
      <stop offset="1" stop-color="#d9e7ff"/>
    </linearGradient>
    <radialGradient id="orb" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(470 400) scale(330)">
      <stop stop-color="#bfe6ff"/>
      <stop offset="0.55" stop-color="#5aa7fa"/>
      <stop offset="1" stop-color="#2f6bf5"/>
    </radialGradient>
    <filter id="shadow" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceAlpha" stdDeviation="36"/>
      <feOffset dy="40"/>
      <feColorMatrix values="0 0 0 0 0.184 0 0 0 0 0.42 0 0 0 0 0.96 0 0 0 0.32 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur-hi" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="blur-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <clipPath id="orb-clip"><circle cx="512" cy="512" r="300"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="101" y="101" width="822" height="822" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="2"/>
  <g filter="url(#shadow)">
    <g clip-path="url(#orb-clip)">
      <circle cx="512" cy="512" r="300" fill="url(#orb)"/>
      <ellipse cx="470" cy="340" rx="135" ry="82" fill="#ffffff" fill-opacity="0.75" filter="url(#blur-hi)"/>
      <ellipse cx="620" cy="640" rx="165" ry="105" fill="#8fe3ff" fill-opacity="0.7" filter="url(#blur-glow)"/>
    </g>
    <circle cx="512" cy="512" r="291" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="18"/>
  </g>
  <!-- The menu bar mark (16 px grid) in white, scaled to sit inside the orb. -->
  <g transform="translate(512 512) scale(22) translate(-8 -8)" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="4.5" cy="5" r="1.8"/>
    <circle cx="11.5" cy="5" r="1.8"/>
    <circle cx="8" cy="11" r="1.8"/>
    <path d="M6.2 5H9.8M5.4 6.6L7.1 9.5M10.6 6.6L8.9 9.5"/>
  </g>
</svg>
