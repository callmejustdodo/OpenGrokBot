[package]
name = "formation-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
formation-proto = { version = "0.1.0", path = "../formation-proto" }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["sync"] }

[dev-dependencies]
rmcp = { version = "3.9.0", features = ["server", "macros", "transport-io"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
