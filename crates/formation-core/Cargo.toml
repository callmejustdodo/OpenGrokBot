[package]
name = "formation-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
testkit = []

[[bin]]
name = "fake-claude"
path = "testkit/fake_claude.rs"
required-features = ["testkit"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws"] }
formation-proto = { version = "0.1.0", path = "../formation-proto" }
futures-util = { version = "0.3.34", default-features = false }
getrandom = "0.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["sync", "net", "process", "io-util", "rt", "macros", "time", "rt-multi-thread", "fs"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect"] }
unicode-normalization = "0.1"
sha2 = "0.10.9"
toml = "1.2.1"

[dev-dependencies]
formation-core = { path = ".", features = ["testkit"] }
rmcp = { version = "3.9.0", features = ["server", "macros", "transport-io"] }
schemars = "1.0"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4"] }
