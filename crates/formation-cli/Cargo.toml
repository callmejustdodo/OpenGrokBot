[package]
name = "formation-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "formation"
path = "src/main.rs"

[dependencies]
formation-core = { version = "0.1.0", path = "../formation-core" }
formation-proto = { version = "0.1.0", path = "../formation-proto" }
rmcp = { version = "3.9.0", features = ["server", "macros", "transport-io"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["io-util", "io-std", "macros", "net", "rt"] }
