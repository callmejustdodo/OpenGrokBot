[package]
name = "formationd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
formation-core = { path = "../formation-core", features = ["testkit"] }
formation-proto = { path = "../formation-proto" }
serde = "1.0"
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "net", "io-util", "time"] }
