[package]
name = "fake-formationd"
description = "Serves the M3 mockup's world over formationd's local socket protocol, for building the app without the real service (TASK-043)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
formation-proto = { path = "../../crates/formation-proto" }
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.2", features = ["v7", "serde"] }
